name: Full push validation (medium)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-push-validation.yml'

permissions:
  contents: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}

          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_BASE: ${{ secrets.EMBEDDING_API_BASE }}
          
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python - <<'PY'
          from pathlib import Path
          import time
          from hydra import compose, initialize_config_dir
          from omegaconf import OmegaConf
          from openai import OpenAI, APIStatusError
          with initialize_config_dir(version_base=None, config_dir=str(Path("config").resolve())):
              cfg = compose(config_name="default", overrides=["llm.generation_kwargs.model=gpt-6.2-sol", "++llm.generation_kwargs.reasoning_effort=medium"])
          kwargs = OmegaConf.to_container(cfg.llm.generation_kwargs, resolve=True)
          client = OpenAI(api_key=cfg.llm.api.key, base_url=cfg.llm.api.base_url, timeout=120, max_retries=0)
          print("Preflight model:", kwargs["model"], "| reasoning_effort:", kwargs["reasoning_effort"], flush=True)
          started = time.monotonic()
          try:
              response = client.chat.completions.create(messages=[{"role":"system","content":"You summarize scientific papers."},{"role":"user","content":"Summarize in one Chinese sentence: Superconducting qubits are coupled to implement quantum gates."}], **kwargs)
          except APIStatusError as e:
              print("Preflight failed: HTTP", e.status_code, type(e).__name__)
              raise SystemExit(1) from None
          except Exception as e:
              print("Preflight failed:", type(e).__name__)
              raise SystemExit(1) from None
          if not response.choices or not (response.choices[0].message.content or "").strip():
              raise SystemExit("Preflight failed: empty response")
          print("Preflight succeeded:", response.model, "| seconds:", round(time.monotonic()-started,2), flush=True)
          PY
          echo "Starting complete digest with medium reasoning"
          uv run src/zotero_arxiv_daily/main.py llm.generation_kwargs.model=gpt-6.2-sol ++llm.generation_kwargs.reasoning_effort=medium
