name: Full push validation (default reasoning)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-push-validation.yml'

permissions:
  contents: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}

          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_BASE: ${{ secrets.EMBEDDING_API_BASE }}
          
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python - <<'PY'
          import runpy
          import sys
          import feedparser
          from omegaconf import OmegaConf

          # Use the provider's default reasoning setting.
          path = "config/custom.yaml"
          cfg = OmegaConf.load(path)
          generation = OmegaConf.select(cfg, "llm.generation_kwargs")
          if generation is not None:
              generation.pop("reasoning_effort", None)
          OmegaConf.save(cfg, path)

          # Replay only if the live RSS is valid but contains no eligible new papers.
          # These seven paper IDs were retrieved by the actual run #179.
          previous_ids = ["2611.27703", "2611.27702", "2611.27140", "2611.27787", "2611.27507", "2611.27640", "2611.27535"]
          original_parse = feedparser.parse
          def parse_with_replay(url, *args, **kwargs):
              result = original_parse(url, *args, **kwargs)
              if isinstance(url, str) and url.startswith("https://rss.arxiv.org/atom/"):
                  entries = result.get("entries", [])
                  print("Validation live RSS entries:", len(entries), flush=True)
                  if result.get("status") == 200 and not result.get("bozo") and result.get("feed", {}).get("title") and "Feed error for query" not in result["feed"]["title"] and not any(x.get("arxiv_announce_type", "new") == "new" for x in entries):
                      print("Validation mode: replay seven real papers from run #179; email may repeat previous papers", flush=True)
                      result["entries"] = [feedparser.FeedParserDict({"id": "oai:arXiv.org:" + x, "arxiv_announce_type": "new"}) for x in previous_ids]
                  else:
                      print("Validation mode: live RSS", flush=True)
              return result
          feedparser.parse = parse_with_replay
          sys.argv = ["src/zotero_arxiv_daily/main.py", "llm.generation_kwargs.model=gpt-6.2-sol"]
          print("Validation model: gpt-6.2-sol; reasoning: provider default", flush=True)
          runpy.run_path(sys.argv[0], run_name="__main__")
          PY
