name: Full push validation with reasoning comparison
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-push-validation.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    outputs:
      effort: ${{ steps.probe.outputs.effort }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}
      - uses: astral-sh/setup-uv@v7
      - name: Compare model requests
        id: probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python - <<'PY'
          import os
          import time
          from pathlib import Path
          from hydra import compose, initialize_config_dir
          from omegaconf import OmegaConf
          from openai import OpenAI, APIStatusError
          with initialize_config_dir(version_base=None, config_dir=str(Path("config").resolve())):
              cfg = compose(config_name="default", overrides=["llm.generation_kwargs.model=gpt-6.2-sol"])
          kwargs = OmegaConf.to_container(cfg.llm.generation_kwargs, resolve=True)
          kwargs.pop("reasoning_effort", None)
          client = OpenAI(api_key=cfg.llm.api.key, base_url=cfg.llm.api.base_url, timeout=120, max_retries=0)
          messages = [{"role":"system","content":"You are a helpful assistant."},{"role":"user","content":"Reply with only OK."}]
          successes = []
          for effort in ("medium", "default"):
              options = dict(kwargs)
              if effort == "medium":
                  options["reasoning_effort"] = "medium"
              started = time.monotonic()
              try:
                  result = client.chat.completions.create(messages=messages, **options)
                  if not result.choices or not (result.choices[0].message.content or "").strip():
                      print("Comparison", effort, "failed: empty response", flush=True)
                  else:
                      successes.append(effort)
                      print("Comparison", effort, "succeeded; model:", result.model, "seconds:", round(time.monotonic()-started,2), flush=True)
              except APIStatusError as e:
                  print("Comparison", effort, "failed: HTTP", e.status_code, type(e).__name__, flush=True)
              except Exception as e:
                  print("Comparison", effort, "failed:", type(e).__name__, flush=True)
          if not successes:
              raise SystemExit("Neither comparison request succeeded")
          selected = "medium" if "medium" in successes else "default"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("effort=" + selected + "\n")
          print("Selected reasoning effort:", selected, flush=True)
          PY
  calculate-and-send:
    needs: preflight
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}

          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
          EMBEDDING_API_BASE: ${{ secrets.EMBEDDING_API_BASE }}
          
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          VALIDATED_EFFORT: ${{ needs.preflight.outputs.effort }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          if [ "$VALIDATED_EFFORT" = medium ]; then
            uv run src/zotero_arxiv_daily/main.py llm.generation_kwargs.model=gpt-6.2-sol ++llm.generation_kwargs.reasoning_effort=medium
          else
            uv run python -c 'from omegaconf import OmegaConf; p="config/custom.yaml"; c=OmegaConf.load(p); g=OmegaConf.select(c,"llm.generation_kwargs"); g.pop("reasoning_effort",None) if g is not None else None; OmegaConf.save(c,p)'
            uv run src/zotero_arxiv_daily/main.py llm.generation_kwargs.model=gpt-6.2-sol
          fi
