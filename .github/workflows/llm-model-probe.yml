name: Temporary LLM model probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/llm-model-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Test configured chat completions API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python - <<'PY'
          from pathlib import Path
          import time
          from hydra import compose, initialize_config_dir
          from omegaconf import OmegaConf
          from openai import OpenAI, APIStatusError
          with initialize_config_dir(version_base=None, config_dir=str(Path("config").resolve())):
              cfg = compose(config_name="default", overrides=["llm.generation_kwargs.model=6.2sol"])
          kwargs = OmegaConf.to_container(cfg.llm.generation_kwargs, resolve=True)
          client = OpenAI(api_key=cfg.llm.api.key, base_url=cfg.llm.api.base_url, timeout=120, max_retries=0)
          print("Testing model:", kwargs["model"], flush=True)
          started = time.monotonic()
          try:
              result = client.chat.completions.create(
                  messages=[{"role": "system", "content": "You are a helpful assistant."},
                            {"role": "user", "content": "Reply with only OK."}],
                  **kwargs,
              )
          except APIStatusError as e:
              print("Probe failed: HTTP", e.status_code, "| exception:", type(e).__name__)
              raise SystemExit(1) from None
          except Exception as e:
              print("Probe failed:", type(e).__name__)
              raise SystemExit(1) from None
          if not result.choices or not (result.choices[0].message.content or "").strip():
              print("Probe failed: empty response")
              raise SystemExit(1)
          print("Probe succeeded: nonempty chat completion received")
          print("Elapsed seconds:", round(time.monotonic()-started, 2))
          print("Returned model:", result.model)
          PY
