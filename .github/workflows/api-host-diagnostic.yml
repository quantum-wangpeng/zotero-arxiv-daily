name: Temporary API provider diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/api-host-diagnostic.yml'
permissions:
  contents: read
jobs:
  identify-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Identify API hostname only
        env:
          API_BASE: ${{ secrets.OPENAI_API_BASE }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit
          value = os.environ.get("API_BASE", "").strip()
          if not value:
              raise SystemExit("API base is missing")
          try:
              parsed = urlsplit(value if "://" in value else "https://" + value)
              host = parsed.hostname
          except ValueError:
              raise SystemExit("API base is not a valid URL") from None
          if not host or not re.fullmatch(r"[A-Za-z0-9.-]+", host):
              raise SystemExit("No valid DNS hostname found")
          print("API provider hostname:", host)
          PY
